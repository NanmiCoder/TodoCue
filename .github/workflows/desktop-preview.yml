name: Desktop preview builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/client/**
      - packages/cli/**
      - packages/server/**
      - scripts/package-windows.mjs
      - scripts/windows-bundler.mjs
      - scripts/tests/windows-bundler.test.mjs
      - scripts/smoke-windows-install.mjs
      - scripts/stage-runtime.mjs
      - package-lock.json
      - .github/workflows/desktop-preview.yml
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.7.0'
          cache: npm
      - run: rustup update stable
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: desktop-rust-v2-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci --ignore-scripts
      - run: npm run desktop:build
      - run: npm run check
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
        id: rust-check
      - run: npm run windows:preview
      - name: Installed preview runtime smoke
        run: node scripts/smoke-windows-install.mjs
        env:
          TODOCUE_INSTALL_SMOKE_REPORT: ${{ runner.temp }}/todocue-install-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: todocue-windows-${{ matrix.arch }}-install-smoke
          path: ${{ runner.temp }}/todocue-install-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: todocue-windows-${{ matrix.arch }}-preview
          path: apps/desktop/src-tauri/target/*/release/bundle/nsis/*
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.rust-check.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  macos:
    name: macos (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            macho: arm64
          - runner: macos-15-intel
            arch: x64
            macho: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      APPLE_SIGNING_IDENTITY: '-'
      TODOCUE_HOME: /tmp/todocue-desktop-preview-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.7.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify native architecture and SDK
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Wrong runner architecture")'
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - run: rustup update stable
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', '.github/workflows/desktop-preview.yml') }}
          restore-keys: |
            desktop-rust-v3-${{ runner.os }}-${{ runner.arch }}-
            desktop-rust-v2-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci --ignore-scripts
      - run: npm run desktop:check
        id: rust-check
      - name: Build shared macOS Preview App
        run: npm run tauri --workspace @todocue/desktop -- build --bundles app --config '{"bundle":{"active":true}}'
      - name: Verify and archive shared Preview App
        env:
          EXPECTED_MACHO: ${{ matrix.macho }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          app="apps/desktop/src-tauri/target/release/bundle/macos/TodoCue Preview.app"
          /usr/bin/lipo "$app/Contents/MacOS/todocue-desktop" -verify_arch "$EXPECTED_MACHO"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          version="$(node -p 'require("./package.json").version')"
          out="apps/desktop/build/TodoCue-${version}-macOS-${EXPECTED_ARCH}-preview.zip"
          mkdir -p apps/desktop/build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          (cd apps/desktop/build && shasum -a 256 "$(basename "$out")" > "$(basename "$out").sha256")
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          fs.writeFileSync('apps/desktop/build/BUILD.json', JSON.stringify({
            version, arch: process.arch, source: process.env.GITHUB_SHA,
            client: 'shared-tauri-preview', signing: 'ad-hoc',
            requiresExternalRuntime: true,
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: todocue-macos-${{ matrix.arch }}-desktop-preview
          path: apps/desktop/build/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.rust-check.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
